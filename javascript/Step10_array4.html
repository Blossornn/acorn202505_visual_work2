  <body>
    <script>
      const names = ["김구라", "해골", "원숭이"];
      // 배열에 새로운 아이템 추가
      names.push("주뎅이");
      names.push("덩어리");
      // 배열의 .concat() 함수는 item이 추가 된 새로운 배열을 리턴
      const names2 = names.concat("추가1");
      const names3 = names.concat("추가2", "추가3", "추가4");
    </script>
  </body>
