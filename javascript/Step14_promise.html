<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Step14_promise.html</title>
  </head>
  <body>
    <h3>이미지를 선택하세요</h3>
    <input type="file" id="fileInput" accept="image/*" multiple />
    <div id="preview"></div>
    <script>
      // 이미지 파일을 선택했을 때 실행 할 함수 등록
      document.querySelector("#fileInput").addEventListener("change", (e) => {
        // e.target은 "change" 이벤트가 발생한 바로 그 요소의 참조값
        // 선택 된 파일 객체가 들어있는 파일
        const files = e.target.files;
        console.log(files);
        // FileReader 객체를 이용해서 선택한 파일 데이터를 읽어들인다.
        const reader = new FileReader();
        // files 배열의 0 번방에 들어 있는 파일을 DataURL 형식으로 읽어들이고
        reader.readAsDataURL(files[0]);
        // 다 읽었을 때 실행 할 함수 등록
        reader.onload = () => {
          // 읽은 DataURL 형식의 문자열을 콘솔창에 출력
          console.log(reader.result);
          // backtic을 이용해서 html 형식의 문자열을 구성하고
          const img = `<img src = "${reader.result}">`;
          // id가 preview인 곳에 HTML로 해석되도록 끼워 넣는다.
          document
            .querySelector("#preview")
            .insertAdjacentHTML("beforeend", img);
        };
        console.log("FileReader 객체를 이용해서 읽기 시작!");
      });
    </script>
  </body>
</html>
