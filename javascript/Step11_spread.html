  <body>
    <script>
      const names = ["김구라", "해골"];
      // ... spread 연산자를 이용해 배열에 저장 된 내용을 새로운 배열에 펼쳐 놓고 아이템이 추가 된 배열을 얻어낼 수 있다.
      const names2 = [...names, "원숭이"];

      const mem1 = { num: 1, name: "김구라" };
        // Object도 spread 연산자를 사용 할 수 있다.
      const mem2 = { ...mem1, addr: "노량진" };
      const mem3 = {
        ...mem1,
        addr: "노량진",
        isMan: true,
      };
      const mem4 = { ...mem3, name: "이정호" };
    </script>
  </body>
